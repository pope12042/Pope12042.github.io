async function freeModels(){

const score=m=>{
  const id=(m.id+" "+m.name).toLowerCase();let s=Math.log2(Math.max(m.ctx,4096));
  const b=id.match(/(\d+(?:\.\d+)?)b\b/);if(b)s+=Math.log2(+b[1]+1)*1.2;
  if(/ultra|pro|large|max|plus|super/.test(id))s+=3;
  if(/mini|nano|lite|small|tiny|\b[1-4]b\b/.test(id))s-=3;
  if(/coder|omni|\bvl\b/.test(id))s-=1;
  return s+Math.max(0,3-(Date.now()/1000-m.created)/7.8e6);
};
async function orModels(hist){

}
async function turn(pv,sys,hist,extra,on,signal){

    const r=await fetch(gURL(1),{method:"POST",headers:gh(),body:JSON.stringify(body),signal});
    if(!r.ok)await bad(r,"Gemini");

    await sse(r,j=>(j.candidates?.[0]?.content?.parts||[]).forEach(p=>{if(p.text){text+=p.text;on(p.text)}if(p.functionCall)calls.push({name:p.functionCall.name,args:p.functionCall.args||{},raw:p})}));
    return{text,calls,model:S.gmodel};
  }
  const ids=await orModels(hist);const body={...(ids.length>1?{models:ids}:{model:ids[0]}),stream:true,messages:[{role:"system",content:sys},...hist.map(m=>({role:m.role,content:m.role=="user"?orC(m):m.text})),...extra]};
  if(S.tools.length)body.tools=S.tools.map(t=>({type:"function",function:{name:t.name,description:t.description,parameters:t.schema}}));
  const r=await fetch(URL_,{method:"POST",headers:{Authorization:"Bearer "+S.key,"Content-Type":"application/json"},body:JSON.stringify(body),signal});
  if(!r.ok)await bad(r,"OpenRouter");
  const tc=[];let mdl="";
  await sse(r,j=>{if(j.model)mdl=j.model;const d=j.choices?.[0]?.delta;if(!d)return;if(d.content){text+=d.content;on(d.content)}
    (d.tool_calls||[]).forEach(x=>{const o=tc[x.index||0]=tc[x.index||0]||{id:"",name:"",args:""};if(x.id)o.id=x.id;if(x.function?.name)o.name+=x.function.name;if(x.function?.arguments)o.args+=x.function.arguments})});
  return{text,model:mdl,calls:tc.filter(Boolean).map(o=>{let a={};try{a=JSON.parse(o.args||"{}")}catch(e){}return{id:o.id,name:o.name,args:a}})};
}

    <p class="dim" style="margin:6px 4px 0">Get a key at aistudio.google.com. Free-tier prompts may be used to improve Google products. Keys stay on this device.</p>`}
  else if(sec=="persona"){title="Personality";h=`<textarea class="inp" id="pe" rows="4">${esc(P.personality)}</textarea><p class="dim" style="margin:6px 4px 0">Rae picks the background colors from this.</p>`}
  else if(sec=="system"){title="System message";h=`<textarea class="inp" id="sy" rows="8" placeholder="Extra rules for Rae, e.g. keep answers short.">${esc(P.system_prompt)}</textarea>`}
  else{title="Skills";h=P.skills.map((k,i)=>`<p class="lbl">${esc(k.name)}/skill.md</p><textarea class="inp" data-k="${i}" rows="10">${esc(k.text)}</textarea>`).join("")+`<button class="pill" id="rs">Reset to defaults</button>`}
  app.innerHTML=`<section class="pg"><div class="top"><button class="link" id="bk">Back</button><span></span></div><h1>${title}</h1>${h}<p class="err" id="msg"></p>${B("sv","Save")}</section>`;
  $("#bk").onclick=settings;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{prov=b.dataset.p;document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x==b))});
  if($("#rs"))$("#rs").onclick=async()=>{P.skills=JSON.parse(JSON.stringify(DEF.skills));try{await saveProf();setSec("skills")}catch(e){setMsg(e.message)}};
  $("#sv").onclick=async()=>{
    try{setMsg("Saving…");
      if(sec=="models"){S.prov=prov;S.key=$("#ky").value.trim();S.model=$("#md").value.trim()||"best-free";S.gkey=$("#gk").value.trim();S.gmodel=$("#gm").value.trim()||"gemini-flash-latest";
        w("rae_prov",S.prov);w("rae_key",S.key);w("rae_model",S.model);w("rae_gkey",S.gkey);w("rae_gmodel",S.gmodel)}
      else if(sec=="persona"){const pe=$("#pe").value.trim()||DEF.personality;if(pe!=P.personality)P.palette=await mkPal(pe);P.personality=pe;await saveProf();bg()}
      else if(sec=="system"){P.system_prompt=$("#sy").value.trim();await saveProf()}
      else{document.querySelectorAll("[data-k]").forEach(t=>P.skills[+t.dataset.k].text=t.value);await saveProf()}
      setMsg("Saved.");
    }catch(e){setMsg(e.message)}
  };
}
boot();
</script>
</body>
</html>
