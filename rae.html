async function ask(sys,user){
  if(provs()[0]=="gemini"){const j=await(await fetch(gURL(0),{method:"POST",headers:gh(),body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:"user",parts:[{text:user}]}]})})).json();return j.candidates[0].content.parts.map(p=>p.text||"").join("")}
  const j=await(await OR({model:S.model,messages:[{role:"system",content:sys},{role:"user",content:user}]})).json();return j.choices[0].message.content;
}
async function mkPal(p){
  const h=[...p].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%360;
  let pal=[`hsl(${h} 70% 45%)`,`hsl(${(h+60)%360} 65% 40%)`,`hsl(${(h+180)%360} 60% 38%)`];
  if(hasKey())try{
    const t=await ask("Reply ONLY with a JSON array of exactly 3 CSS hex colors (#rrggbb), medium saturation, that visually express this AI personality.",p),a=JSON.parse(t.slice(t.indexOf("["),t.lastIndexOf("]")+1));
    if(a.length==3&&a.every(c=>/^#[0-9a-f]{6}$/i.test(c)))pal=a;
  }catch(e){}
  return pal;
}

  const draw=()=>{$("#cl").innerHTML=S.conns.length?S.conns.map(c=>`<div class="row" data-id="${c.id}"><span class="ci" data-l="${esc((c.name||"?")[0])}"><img src="${esc(icoOf(c))}" onerror="this.remove()"></span><span class="grow"><div>${esc(c.name)}</div><div class="dim" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${g("rae_auth_"+c.id)?`<span style="color:#ff9f0a">Needs login</span>`:esc(c.url)}</div></span><button class="ib" data-login="1" title="Log in" ${g("rae_auth_"+c.id)?'style="color:#ff9f0a"':""}>${I("log-in")}</button><input type="checkbox" class="sw" ${c.enabled?"checked":""}><button class="ib" data-d="1">${I("trash-2")}</button></div>`).join(""):`<div class="row dim">No connectors yet.</div>`;ic()};

  $("#cl").onclick=async e=>{const lg=e.target.closest("[data-login]");if(lg){const c=S.conns.find(x=>x.id==lg.closest("[data-id]").dataset.id);try{await login(c)}catch(x){const t=prompt(x.message+"\n\nPaste an access token instead (optional):");if(t){w("rae_tok_"+c.id,t.trim());rm("rae_auth_"+c.id);delete S.mcp[c.id];draw();setMsg("Token saved.")}else setMsg(x.message)}return}const b=e.target.closest("[data-d]");if(!b)return;const id=b.closest("[data-id]").dataset.id;await sb.from("rae_connectors").delete().eq("id",id);S.conns=S.conns.filter(x=>x.id!=id);delete S.mcp[id];draw()};

    const{data,error}=await sb.from("rae_connectors").insert({name,url}).select().single();if(error)return setMsg(error.message);

  };
}

const GLs={cols:[[.12,.43,.92],[.05,.64,.64],[.96,.62,.04],[.04,.13,.28]]};

function startGL(){
  const cv=$("#gl"),gl=cv&&cv.getContext("webgl",{antialias:false,alpha:false,powerPreference:"low-power"});if(!gl)return;
  const VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  const FS=`precision highp float;uniform vec2 R;uniform float T;uniform vec3 A,B,C,D;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/min(R.x,R.y);
  float a=(length(uv)*3.1+T*.1)*.57,s=sin(a),c=cos(a);uv=mat2(c,-s,s,c)*uv*1.45;
  vec2 q=uv;
  for(int i=0;i<5;i++){float f=float(i)+1.;q+=.55/f*vec2(sin(q.y*1.7*f+T*.16+f),cos(q.x*1.5*f-T*.13+f));}
  float k1=n(q*1.1+T*.03),k2=n(q*1.3-T*.04+7.),k3=n(q*.9+T*.03+13.);
  vec3 col=mix(A,B,smoothstep(.2,.8,k1));col=mix(col,C,smoothstep(.3,.9,k2)*.8);col=mix(col,D,smoothstep(.45,.95,k3)*.75);
  gl_FragColor=vec4(col,1.);}`;
  const mk=(t,x)=>{const o=gl.createShader(t);gl.shaderSource(o,x);gl.compileShader(o);return o},pr=gl.createProgram();
  gl.attachShader(pr,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;
  gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  const U={};["R","T","A","B","C","D"].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
  const fit=()=>{const k=.5*Math.min(devicePixelRatio||1,2);cv.width=Math.max(2,Math.round(innerWidth*k));cv.height=Math.max(2,Math.round(innerHeight*k));gl.viewport(0,0,cv.width,cv.height)};

  const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const loop=t=>{if(document.body.classList.contains("perf")||document.hidden){GLs.run=0;return}gl.uniform2f(U.R,cv.width,cv.height);gl.uniform1f(U.T,t/1000);["A","B","C","D"].forEach((n,i)=>gl.uniform3fv(U[n],GLs.cols[i]));gl.drawArrays(gl.TRIANGLE_STRIP,0,4);if(!still)requestAnimationFrame(loop);else GLs.run=0};
  GLs.kick=()=>{if(!GLs.run){GLs.run=1;requestAnimationFrame(loop)}};GLs.kick();document.addEventListener("visibilitychange",GLs.kick);
}

const isVideo=b=>/window\.VIDEO/.test(b.code)&&/drawFrame/.test(b.code);
function codeBox(b){
  const cb=document.createElement("div");cb.className="cb";
  cb.innerHTML=`<div class="ch"><span>${I("file-code")}${esc(b.name||b.lang||"code")}</span><div style="display:flex"><button class="ib cp" title="Copy code">${I("copy")}</button></div></div><pre><code class="language-${esc(b.lang||"plaintext")}"></code></pre>`;
  const c=cb.querySelector("code");c.textContent=b.code;try{hljs.highlightElement(c)}catch(e){}return cb;
}
function mkVideoCard(b,auto){
  const title=((b.code.match(/<title[^>]*>([^<]{1,60})/i)||[])[1]||b.name||"Video").trim(),fname=(title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"rae-video")+".mp4";
  const el=document.createElement("div");el.className="fc vc";
  el.innerHTML=`<button class="fh vh"><span class="sq big" style="background:#ff375f">${I("clapperboard")}</span><span class="grow"><div>${esc(title)}</div><div class="dim vs2">${auto?"Preparing video…":"Tap to make the video"}</div></span>${I("chevron-down","cv")}</button><div class="pbar" hidden><b></b></div><div class="fb" hidden><div class="vp"></div></div>`;
  const sub=el.querySelector(".vs2"),bar=el.querySelector(".pbar b"),pbar=el.querySelector(".pbar"),fb=el.querySelector(".fb"),vp=fb.querySelector(".vp");
  let state="idle",url="",err="",codeOn=0;
  const draw=()=>{
    const code=`<button class="pill" data-k="code">${codeOn?"Hide code":"View code"}</button><div class="cwrap" ${codeOn?"":"hidden"}></div>`;
    vp.innerHTML=state=="done"?`<video controls playsinline src="${url}"></video><a class="pill dl" href="${url}" download="${esc(fname)}">${I("download")}Download video</a>`+code
      :state=="busy"?`<p class="dim" style="padding:6px 4px">Rendering frame by frame. This can take a little while, you can keep chatting.</p>`
      :state=="err"?`<p class="err">${esc(err)}</p><button class="pill" data-k="make">Try again</button>`+code
      :`<button class="pill" data-k="make">Make the video</button>`+code;
    if(codeOn)vp.querySelector(".cwrap").append(codeBox(b));ic();
  };
  const run=async()=>{
    if(state=="busy")return;state="busy";err="";pbar.hidden=false;bar.style.width="0";sub.textContent="Rendering video… 0%";if(!fb.hidden)draw();
    let host=null;
    try{
      host=makeRun(b.code,"html");host.hidden=true;el.append(host);
      await new Promise((ok,no)=>{const t0=Date.now(),iv=setInterval(()=>{if(host._v){clearInterval(iv);ok()}else if(Date.now()-t0>15000){clearInterval(iv);no(new Error("The video page didn’t start. Open the code to check it."))}},100)});
      url=await encodeVideo(host,p=>{bar.style.width=Math.round(p*100)+"%";sub.textContent="Rendering video… "+Math.round(p*100)+"%"});
      state="done";sub.textContent="Video ready · tap to watch";
    }catch(e){state="err";err=e.message;sub.textContent="Couldn’t render · tap for details"}
    pbar.hidden=true;if(host)host.remove();if(!fb.hidden)draw();
  };
  el.querySelector(".vh").onclick=()=>{
    fb.hidden=!fb.hidden;el.classList.toggle("open",!fb.hidden);if(fb.hidden)return;draw();
    const v=vp.querySelector("video");if(v)v.play().catch(()=>{});
  };
  vp.onclick=e=>{const k=e.target.closest("[data-k]");if(!k)return;if(k.dataset.k=="code"){codeOn=!codeOn;draw()}else run()};
  if(auto)setTimeout(run,50);
  return el;
}

/* appearance: theme, font, performance */
const rg=(h,a)=>{const n=parseInt(h.slice(1),16);return"rgba("+(n>>16)+","+(n>>8&255)+","+(n&255)+","+a+")"};
const mkT=(n,base,acc,ov)=>({n,base,acc,txt:"#fff",sub:"#9ca3af",card:"rgba(255,255,255,.06)",fill:"rgba(255,255,255,.1)",sep:"rgba(255,255,255,.1)",hov:"rgba(255,255,255,.2)",glass:"rgba(255,255,255,.08)",bar:rg(base,.55),bar2:rg(base,.72),pop:"#1c1c1e",ov:rg(base,ov),cs:"dark"});
const THEMES={dark:mkT("Dark","#121212","#0a84ff",.46),oled:mkT("OLED","#000000","#0a84ff",.8),ocean:mkT("Ocean","#0b1623","#38bdf8",.5),forest:mkT("Forest","#0d1a14","#34d399",.5),sunset:mkT("Sunset","#1c1210","#fb923c",.5),rose:mkT("Rose","#1a0f14","#fb7185",.5),
 light:{n:"Light",base:"#f2f2f7",acc:"#0a84ff",txt:"#111114",sub:"#6b7280",card:"rgba(255,255,255,.7)",fill:"rgba(0,0,0,.07)",sep:"rgba(0,0,0,.1)",hov:"rgba(0,0,0,.12)",glass:"rgba(255,255,255,.75)",bar:"rgba(242,242,247,.7)",bar2:"rgba(242,242,247,.88)",pop:"#ffffff",ov:"rgba(242,242,247,.55)",cs:"light"}};
function applyTheme(k){
  const t=THEMES[k]||THEMES.dark,r=document.documentElement.style;
  ["base","txt","sub","card","fill","sep","hov","glass","bar","bar2","pop","ov"].forEach(n=>r.setProperty("--"+n,t[n]));r.setProperty("--blue",t.acc);r.colorScheme=t.cs;
}
const FONTS=["Inter","DM Sans","Manrope","Outfit","Space Grotesk","Sora","Plus Jakarta Sans","Nunito","Poppins","IBM Plex Sans","Instrument Sans","Bricolage Grotesque","Fraunces","Lora","Merriweather","Playfair Display","JetBrains Mono","Space Mono"];
function loadGF(name,ok,no){
  const id="gf-"+name.replace(/\W/g,"");if(document.getElementById(id)){ok&&ok();return}
  const mk=w=>{const l=document.createElement("link");l.id=id;l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family="+encodeURIComponent(name).replace(/%20/g,"+")+w+"&display=swap";return l};
  const a=mk(":wght@400;500;600;700");a.onload=()=>ok&&ok();
  a.onerror=()=>{a.remove();const b=mk("");b.onload=()=>ok&&ok();b.onerror=()=>{b.remove();no&&no()};document.head.append(b)};
  document.head.append(a);
}
function applyFont(f){document.body.style.fontFamily=f&&f.name?'"'+f.name+'",-apple-system,"SF Pro Text",system-ui,sans-serif':""}
function setFont(f){applyFont(f);try{f?localStorage.setItem("rae_font",JSON.stringify(f)):localStorage.removeItem("rae_font")}catch(e){}}
function useFontFile(f){
  let st=document.getElementById("ff");if(!st){st=document.createElement("style");st.id="ff";document.head.append(st)}
  st.textContent='@font-face{font-family:"RaeCustom";src:url("'+f.data+'")}';
}
const perfOn=()=>{const m=g("rae_perf")||"auto";return m=="on"||(m=="auto"&&(matchMedia("(pointer:coarse)").matches||innerWidth<700))};
function applyPerf(){document.body.classList.toggle("perf",perfOn());if(GLs.kick)GLs.kick()}
function initLook(){
  applyTheme(g("rae_theme")||"dark");applyPerf();
  let f=null;try{f=JSON.parse(g("rae_font")||"null")}catch(e){}
  if(f&&f.type=="file"){try{const d=JSON.parse(g("rae_fontfile")||"null");if(d){useFontFile(d);applyFont(f)}}catch(e){}}
  else if(f&&f.name)loadGF(f.name,()=>applyFont(f));
}
function lookView(){
  const th=g("rae_theme")||"dark",pm=g("rae_perf")||"auto";let f=null;try{f=JSON.parse(g("rae_font")||"null")}catch(e){}
  const cur=f&&f.name||"";
  const prev=document.createElement("link");prev.rel="stylesheet";prev.href="https://fonts.googleapis.com/css2?"+FONTS.map(n=>"family="+n.replace(/ /g,"+")).join("&")+"&display=swap";document.head.append(prev);
  const rows=["",...FONTS].map(n=>`<button class="row fr${n==cur?" on":""}" data-f="${esc(n)}"><span class="grow" style="${n?`font-family:'${esc(n)}'`:""}">${n||"System default"}</span>${n==cur?I("check"):""}</button>`).join("");
  app.innerHTML=`<section class="pg"><div class="top"><button class="link" id="bk">Back</button><span></span></div><h1>Appearance</h1>
  <p class="lbl">Theme</p><div class="tgrid" id="tg">${Object.entries(THEMES).map(([k,t])=>`<button data-t="${k}" class="th${k==th?" on":""}"><span class="sw2" style="background:linear-gradient(135deg,${t.base} 50%,${t.acc} 50%)"></span>${t.n}</button>`).join("")}</div>
  <p class="lbl">Font</p><div class="card" id="fl">${rows}</div>
  <p class="lbl">Any Google font</p><div style="display:flex;gap:8px"><input class="inp" id="cf" placeholder="e.g. Caveat, Lexend, Rubik" autocapitalize="words"><button class="pill" id="cu" style="width:84px;margin:0">Use</button></div>
  <button class="pill" id="uf" style="display:flex;align-items:center;justify-content:center;gap:8px">${I("upload")}Upload a font file</button><input type="file" hidden id="ffi" accept=".ttf,.otf,.woff,.woff2"><p class="err" id="msg"></p>
  <p class="lbl">Performance mode</p><div class="seg" id="pm">${["auto","on","off"].map(k=>`<button data-p="${k}" class="${k==pm?"on":""}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>
  <p class="dim" style="margin:6px 4px 0">Turns off blur, the animated gradient and most animations so phones stay smooth. Auto switches it on for touch devices.</p></section>`;ic();
  $("#bk").onclick=chatView;
  $("#tg").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;w("rae_theme",b.dataset.t);applyTheme(b.dataset.t);document.querySelectorAll(".th").forEach(x=>x.classList.toggle("on",x==b))};
  $("#pm").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;w("rae_perf",b.dataset.p);applyPerf();document.querySelectorAll("#pm button").forEach(x=>x.classList.toggle("on",x==b))};
  const mark=n=>{document.querySelectorAll(".fr").forEach(r=>{const on=r.dataset.f==n;r.classList.toggle("on",on);r.querySelector("svg")&&r.querySelector("svg").remove();if(on){r.insertAdjacentHTML("beforeend",I("check"));ic()}})};
  $("#fl").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;const n=b.dataset.f;if(!n){setFont(null);mark("");return}setMsg("Loading "+n+"…");loadGF(n,()=>{setFont({type:"gf",name:n});mark(n);setMsg("")},()=>setMsg("Couldn’t load that font."))};
  $("#cu").onclick=()=>{const n=$("#cf").value.trim();if(!n)return;setMsg("Loading "+n+"…");loadGF(n,()=>{setFont({type:"gf",name:n});mark("");setMsg("Using "+n+".")},()=>setMsg("That name isn’t in the Google Fonts library."))};
  $("#uf").onclick=()=>$("#ffi").click();
  $("#ffi").onchange=e=>{const f0=e.target.files[0];if(!f0)return;const rd=new FileReader();rd.onload=()=>{try{localStorage.setItem("rae_fontfile",JSON.stringify({data:rd.result}))}catch(x){return setMsg("That font file is too big to save on this device.")}useFontFile({data:rd.result});setFont({type:"file",name:"RaeCustom"});mark("");setMsg("Using your font file.")};rd.readAsDataURL(f0)};
}
initLook();
boot();
</script>
</body>
</html>
